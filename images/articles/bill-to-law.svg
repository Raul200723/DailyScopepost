<svg width="800" height="450" viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Illustration of a legislative document moving toward a signature">
  <defs>
    <radialGradient id="bg-bill-to-law" cx="32%" cy="30%" r="95%">
      <stop offset="0%" stop-color="#9c2c45"/>
      <stop offset="55%" stop-color="#7a1f34"/>
      <stop offset="100%" stop-color="#10141f"/>
    </radialGradient>
    <linearGradient id="sheen-bill-to-law" x1="0" y1="0" x2="1" y2="1" gradientTransform="rotate(115 0.5 0.5)">
      <stop offset="0%" stop-color="#faf8f4" stop-opacity="0.10"/>
      <stop offset="45%" stop-color="#faf8f4" stop-opacity="0"/>
