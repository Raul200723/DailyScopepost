<svg width="800" height="450" viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Illustration of a total solar eclipse with the sun's corona visible around the moon">
  <defs>
    <radialGradient id="bg-eclipse" cx="50%" cy="42%" r="80%">
      <stop offset="0%" stop-color="#0f6b74"/>
      <stop offset="55%" stop-color="#12192b"/>
      <stop offset="100%" stop-color="#0b0f1c"/>
    </radialGradient>
    <radialGradient id="corona" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#faf8f4" stop-opacity="0"/>
      <stop offset="55%" stop-color="#faf8f4" stop-opacity="0"/>
      <stop offset="72%" stop-color="#faf8f4" stop-opacity="0.9"/>
      <stop offset="85%" stop-color="#faf8f4" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#faf8f4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="vg-eclipse" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.5"/>
