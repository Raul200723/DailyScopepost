  </defs>
  <rect width="800" height="450" fill="url(#bg-eclipse)"/>
  <circle cx="420" cy="200" r="130" fill="url(#corona)"/>
  <circle cx="420" cy="200" r="72" fill="#0b0f1c" stroke="#faf8f4" stroke-width="1.5" opacity="0.95"/>
  <g stroke="#faf8f4" stroke-width="1" opacity="0.5">
    <line x1="420" y1="70" x2="420" y2="95"/>
    <line x1="420" y1="305" x2="420" y2="330"/>
    <line x1="290" y1="200" x2="315" y2="200"/>
    <line x1="525" y1="200" x2="550" y2="200"/>
  </g>
  <circle cx="150" cy="80" r="1.5" fill="#faf8f4" opacity="0.6"/>
  <circle cx="620" cy="60" r="1.5" fill="#faf8f4" opacity="0.5"/>
  <circle cx="680" cy="150" r="1" fill="#faf8f4" opacity="0.5"/>
  <circle cx="100" cy="300" r="1.5" fill="#faf8f4" opacity="0.4"/>
  <circle cx="680" cy="330" r="1" fill="#faf8f4" opacity="0.4"/>
