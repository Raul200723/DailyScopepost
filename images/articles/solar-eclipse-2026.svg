  <rect x="0" y="0" width="800" height="450" fill="none" stroke="#000" stroke-opacity="0.3" stroke-width="12"/>
  <text x="40" y="404" font-family="-apple-system,Helvetica,Arial,sans-serif" font-size="11.5" letter-spacing="1.8" fill="#faf8f4" opacity="0.7">ORIGINAL EDITORIAL ILLUSTRATION / DAILYSCOPEPOST</text>
  <text x="40" y="52" font-family="Georgia, serif" font-size="19" fill="#faf8f4" opacity="0.92">DailyScopePost</text>
