<svg width="800" height="450" viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Illustration of a shopping cart with rising prices and an upward arrow">
  <defs>
    <radialGradient id="bg-inflation-explainer" cx="32%" cy="30%" r="95%">
      <stop offset="0%" stop-color="#22886a"/>
      <stop offset="55%" stop-color="#1a6b53"/>
      <stop offset="100%" stop-color="#10141f"/>
    </radialGradient>
    <linearGradient id="sheen-inflation-explainer" x1="0" y1="0" x2="1" y2="1" gradientTransform="rotate(128 0.5 0.5)">
      <stop offset="0%" stop-color="#faf8f4" stop-opacity="0.10"/>
      <stop offset="45%" stop-color="#faf8f4" stop-opacity="0"/>
    </linearGradient>
    <filter id="grain-inflation-explainer">
