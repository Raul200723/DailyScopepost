    </radialGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg-inflation-explainer)"/>
  <rect width="800" height="450" fill="url(#sheen-inflation-explainer)"/>
  <rect width="800" height="450" filter="url(#grain-inflation-explainer)"/>
  <g transform="translate(240,60) scale(1.7)" fill="none" stroke="#faf8f4" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.95">
    
<path d="M60 75 H100 L120 175 H210 L230 90 H115"/>
